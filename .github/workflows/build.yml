name: Build

# Compiles all modules and runs the unit tests on every push, so plugin changes made in
# environments that can't reach repo.papermc.io (e.g. cloud agent sessions) still get verified.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        # `build` also runs deployToDevServer; point it at a throwaway folder.
        run: ./gradlew build --no-daemon -PdevServerDirectory="$RUNNER_TEMP/devserver"
