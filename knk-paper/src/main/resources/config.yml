api:
  # Base URL for the KnK backend API
  # TODO: Update this to match your backend server
  base-url: "http://localhost:5294/api"
  
  # Enable debug logging (logs every request/response: URL, latency, headers, body). Off by
  # default: it is noisy. The X-API-Key and Authorization values are redacted either way.
  debug-logging: false
  
  # Allow untrusted SSL certificates (ONLY for development with self-signed certs)
  allow-untrusted-ssl: true
  
  # Authentication configuration (KNG-22)
  #
  # knk-web-api refuses game-server calls to its protected routes (balances, salary, kits,
  # presence, staff mode, freeze, ranks/permissions, account merge...) unless they carry its
  # shared key. Set api-key below to the SAME random value as the API's
  # Security:PluginApiKey (appsettings / environment variable Security__PluginApiKey), e.g.
  # generated with: openssl rand -hex 32
  # With the key the API also trusts the in-game staff member this plugin names for
  # audit-logged changes (X-Acting-User-Id).
  # The plugin won't start with type apikey and an empty api-key - that's deliberate.
  # (Development only: the API can be told to skip the check instead, see
  # Security:AllowUnauthenticatedPluginCalls in knk-web-api - then type none works.)
  auth:
    # Type: none, bearer, apikey
    type: apikey
    # Bearer token (only used if type=bearer)
    bearer-token: ""
    # API key (only used if type=apikey) - must equal knk-web-api's Security:PluginApiKey.
    api-key: ""
    # API key header name (only used if type=apikey). Keep X-API-Key: that's the header the
    # API reads.
    api-key-header: "X-API-Key"
  
  # HTTP timeouts (in seconds)
  timeouts:
    connect: 10
    read: 10
    write: 10

# Account management configuration (Phase 1+)
account:
  # Link code expiry time (in minutes)
  # How long a link code remains valid before expiring
  link-code-expiry-minutes: 20
  
  # Chat capture timeout (in seconds)
  # Maximum time to wait for player chat input during account creation
  chat-capture-timeout-seconds: 120
  
  # Command cooldowns (Phase 5) - Prevents spam and rate limits expensive operations
  cooldowns:
    # Cooldown for /account create command (seconds)
    # Prevents players from spamming account creation
    account-create-seconds: 300  # 5 minutes
    
    # Cooldown for generating link codes (seconds)
    # Rate limit for /account link (no args)
    link-code-generate-seconds: 60  # 1 minute
    
    # Cooldown for consuming link codes (seconds)
    # Rate limit for /account link <code>
    link-code-consume-seconds: 10  # 10 seconds
    
    # Cleanup interval for expired cooldowns (minutes)
    # How often to remove stale cooldown entries from memory
    cleanup-interval-minutes: 5

# WorldTask configuration
world-tasks:
  # How often the plugin polls the API for headless (player-less) WorldTasks
  headless-poll-interval-seconds: 5
  # Idle back-off: the interval doubles up to this value while no headless task is found
  # TODO: this pull-based polling (see HeadlessWorldTaskPoller) should eventually be replaced
  # by the API pushing a notification (e.g. SignalR) the moment a headless task is created,
  # removing the pickup-latency/idle-load trade-off these two settings exist to balance
  headless-poll-max-interval-seconds: 60

# In-game moments queued by the web API for writes made outside a plugin command - e.g. the
# promotion sound/particles/message when an admin grants XP from the web app's player profile
player-notifications:
  # How often the plugin polls the API for them (skipped while no players are online)
  poll-interval-seconds: 2

# Domain discovery (Linear KNG-20, knk-workspace docs/specs/domain-discovery/DESIGN.md §3.6):
# the first time a player enters a Town, District or Structure it is recorded and rewarded once.
# knk-web-api decides everything that matters (which regions are domains, the amounts, the
# once-per-player rule, an hourly cap); these settings only control detection and effects.
# Players in staff/owner mode, frozen, still loading, in an excluded game mode or in a siege
# discover nothing - they discover a place the next time they are in it without being excluded.
discovery:
  enabled: true
  # How often (ticks) the regions players entered are sent to the API, one request per player
  batch-window-ticks: 20
  # At most this many discovery requests per player per minute; the rest waits
  max-requests-per-minute: 12
  excluded-game-modes: [CREATIVE, SPECTATOR]
  exclude-siege-participants: true
  # Under the plugin folder: discoveries made while the API was unreachable, one file per
  # player, replayed every replay-interval-seconds and on the player's next join
  spool-directory: discovery-spool
  replay-interval-seconds: 60
  effects:
    # A Bukkit Sound name (or a namespaced sound key such as minecraft:ui.toast.challenge_complete)
    sound: UI_TOAST_CHALLENGE_COMPLETE
    sound-volume: 0.8
    sound-pitch: 1.0
    # A Bukkit Particle name that needs no extra data
    particle: HAPPY_VILLAGER
    particle-count: 30
    particle-spread: 0.6
    # An extra firework burst when a Town is discovered
    town-firework: true
    # Ticks between the effects of several places discovered at once (Town, then District, ...)
    spacing-ticks: 10
  messages:
    # One line per place, followed by its reward lines. {type} = "the town"/"the district"/...,
    # {parent} = " in &a<town>" for Districts and Structures (empty for a Town)
    discovered: "&bYou discovered {type} &a{name}&b{parent}!"
    # Shown instead when discoveries made while the API was down are granted later
    replay-summary: "&bWhile the server was busy you discovered &a{count}&b place(s):"

# Gate structure state synchronization
gates:
  # How often (seconds) the plugin pushes the current open/closed/destroyed state of every
  # gate to the API, as a safety net for state changes that were never persisted (e.g. a crash
  # mid-animation). The state is also pushed once immediately after every open/close animation
  # completes, and once more right before shutdown, so this interval can stay relatively long.
  state-sync-interval-seconds: 120
  # How often (seconds) the plugin scans every loaded world for orphaned (gate deleted) or
  # duplicate (e.g. left behind by a chunk unload/reload) gate info displays and repairs them.
  # Runs in addition to the one-shot cleanup at startup, so a duplicate that appears while the
  # server is running gets fixed without needing a restart.
  display-cleanup-interval-seconds: 60
  # Continuous damage ("fire") system: a gate door block set alight by a flaming projectile or
  # fire charge burns for fire-duration-seconds, dealing fire-damage-per-tick HealthCurrent
  # damage to its owning gate every fire-tick-interval-seconds for each door block still burning
  # (so several burning blocks stack damage). Health changes apply immediately in memory, so the
  # health display stays live; DB persistence is left to the existing state-sync-interval-seconds
  # sweep above rather than writing on every fire tick, to stay affordable during a siege with
  # several gates burning at once.
  fire-duration-seconds: 8
  fire-damage-per-tick: 2.0
  fire-tick-interval-seconds: 1
  # Pass-through system: InstantOpen mode removes only the door blocks within
  # passthrough-instant-open-radius-blocks of the triggering player's position (sideways, across
  # the gate's full depth), restoring them once the player crosses to the far side or after
  # passthrough-instant-open-timeout-seconds elapses (safety net if they turn back or disconnect).
  passthrough-instant-open-radius-blocks: 1
  passthrough-instant-open-timeout-seconds: 5
  # Rotation gap-fill (docs/features/gate-structure-animation/ROTATION_GAP_FILL_DESIGN.md):
  # Mechanism 1 automatically fills the checkerboard-sparse open-state footprint of a
  # diagonal-hinge ROTATION gate (e.g. a DRAWBRIDGE facing a diagonal direction) at its resting
  # closed/open endpoints, with zero admin action. It's unconditional once enabled - a defect
  # would affect every such gate on the server at once - so this is a kill switch (Decision 5):
  # set to false to fall back to the exact original sparse-lattice behavior server-wide, no
  # restart-affecting code deploy needed. A gate with its own manually-scanned open state
  # (Mechanism 2) is never affected either way - that always takes priority over this.
  rotationGapFill:
    rasterization-enabled: true
  # World/DB sync (docs/features/gate-structure-animation/GATE_WORLD_SYNC_DESIGN.md): a gate's
  # physical world blocks are kept converging on its DB-loaded state via three mechanisms - a
  # startup diagnostic pass (logs mismatches only, never forces a chunk load or a block write),
  # a check-and-fix pass the first time each district is entered (forces only that district's own
  # gates' chunks - see DistrictGateLoader), and this periodic health-check, which re-verifies a
  # small, round-robin batch of already-loaded gates every health-check-interval-seconds, never
  # forcing a chunk load itself - its cost tracks currently-active gates, not total gate count.
  world-sync:
    health-check-interval-seconds: 300
    health-check-batch-size: 15

# Messages configuration
messages:
  # Prefix for all plugin messages
  prefix: "&8[&6KnK&8] &r"
  
  # Account created successfully
  account-created: "&aAccount created successfully! You can now log in on the web app."
  
  # Accounts linked
  account-linked: "&aYour accounts have been linked!"
  
  # Link code generated
  link-code-generated: "&aYour link code is: &6{code}&a. Use this code in the web app. Expires in {minutes} minutes."
  
  # Invalid or expired link code
  invalid-link-code: "&cThis code is invalid or has expired. Use &6/account link &cto get a new one."
  
  # Duplicate account detected
  duplicate-account: "&cYou have two accounts. Please choose which one to keep."
  
  # Merge complete
  merge-complete: "&aAccount merge complete. Your account now has {coins} coins, {gems} gems, and {exp} XP."

# Permanent enchantment books (Linear KNG-5) - the v1 grade level cap (Linear KNG-6,
# knk-workspace docs/specs/items/GRADE_DROPCHANCE.md). An item of grade G may take an enchantment
# only up to definitionMaxLevel / divisor(G) (integer division, as v1). The divisors themselves are
# per-grade fields in the web app (Grade.EnchantLevelCapDivisor: 5,4,3,2,1 for 1-5 stars, empty =
# uncapped for 6-10 stars); the plugin re-reads them from the API every grade-refresh-minutes.
enchant-books:
  grade-cap:
    # false = no grade cap at all (books behave as before KNG-6)
    enabled: true
    # v1 never capped custom enchantments (Poison, Chaos, ...); true caps them like vanilla ones
    apply-to-custom: false
    # Grade assumed for items without one (vanilla-crafted, not from a graded blueprint).
    # 1 = most capped, so vanilla gear is no way around the cap; 0 = uncapped
    ungraded-stars: 1
    # Chance (0.0-1.0) that a book gives one bonus level, still within the cap. v1 rolled
    # nextInt(100) <= 20, which is really 21%; set 0.21 for the exact v1 odds, 0 to disable
    bonus-level-chance: 0.20
    # How often the grade table (divisors) is re-read from the API
    grade-refresh-minutes: 10

# Custom enchantments runtime settings
custom-enchantments:
  disable-for-creative: false
  cooldown-message: "&c%seconds% seconds remaining"
  messages:
    cmd-help-header: "&6Custom Enchantments Commands:"
    cmd-unknown: "&cUnknown subcommand."
    cmd-no-permission: "&cYou don't have permission to use this command."
    cmd-player-only: "&cThis command can only be executed by players."
    cmd-hand: "&cPlease put an item in your hand and run the command."
    cmd-hand-target: "&cTarget player must hold an item in main hand."
    cmd-invalid-level: "&cLevel must be a positive number."
    cmd-usage-add: "&eUsage: /ce add <enchantment> <level>"
    cmd-usage-remove: "&eUsage: /ce remove <enchantment>"
    cmd-usage-info: "&eUsage: /ce info [player]"
    cmd-usage-cooldown: "&eUsage: /ce cooldown clear [player]"
    cmd-unknown-enchantment: "&cUnknown enchantment: %enchantment%"
    cmd-add-success: "&aEnchantment was added to item successfully."
    cmd-add-level: "&cCannot add %enchantment%, max level is %lvl%."
    cmd-remove-success: "&aEnchantment was removed from item successfully."
    cmd-player-not-found: "&cCould not find player %player%."
    cmd-clear: "&aRemoved cooldowns for %player%."
    cmd-reload: "&aPlugin configuration was reloaded."
    cmd-info-header: "&6Custom enchantments on held item:"
    cmd-info-line: "&7- &f%name% %level% &8(id: %id%) &7cooldown: %cooldown%s"
    cmd-info-none: "&7No custom enchantments found on held item."
    ench-use: "&cYou cannot use %enchantment%."

# Cache configuration
cache:
  # Global time-to-live for cached API responses (in seconds)
  # After this duration, cached data is considered stale and will be refetched
  # Recommended: 60-300 seconds (1-5 minutes) depending on data freshness requirements
  ttl-seconds: 60
  
  # Per-entity cache and data access settings (overrides global TTL and policy defaults)
  entities:
    users:
      ttl-minutes: 15          # Cache TTL (minutes)
      max-ttl-minutes: 60      # Maximum allowed TTL
      default-policy: CACHE_FIRST  # Default fetch policy (CACHE_ONLY, CACHE_FIRST, API_ONLY, API_THEN_CACHE_REFRESH, STALE_OK)
      allow-stale: true        # Allow serving stale data
      retry-attempts: 3        # Max retry attempts for API failures
      retry-backoff-ms: 100    # Initial retry delay (milliseconds)
    
    towns:
      ttl-minutes: 30
      max-ttl-minutes: 240
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100
    
    districts:
      ttl-minutes: 30
      max-ttl-minutes: 240
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100
    
    structures:
      ttl-minutes: 20
      max-ttl-minutes: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100
    
    streets:
      ttl-minutes: 60
      max-ttl-minutes: 480
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100
    
    locations:
      ttl-minutes: 20
      max-ttl-minutes: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    enchantments:
      ttl-minutes: 20
      max-ttl-minutes: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    itemBlueprints:
      ttl-minutes: 20
      max-ttl-minutes: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    kits:
      ttl-minutes: 20
      max-ttl-minutes: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    minecraftMaterials:
      ttl-minutes: 60
      max-ttl-minutes: 480
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100
    
    domains:
      ttl-minutes: 30
      max-ttl-minutes: 240
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    grades:
      ttl-minutes: 20
      max-ttl-minutes: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    tags:
      ttl-minutes: 20
      max-ttl-minutes: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    domainCatalog:
      ttl-minutes: 30
      max-ttl-minutes: 240
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    health:
      ttl-seconds: 30          # Health uses seconds (short TTL)
      max-ttl-seconds: 120
      default-policy: CACHE_FIRST
      allow-stale: false       # Don't serve stale health checks
      retry-attempts: 2        # Fewer retries for health checks
      retry-backoff-ms: 50

    menus:
      ttl-minutes: 20
      max-ttl-minutes: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    # user-features permission system (docs/specs/user-features/IMPLEMENTATION_PLAN.md §1).
    # Short TTL like health - permission checks happen constantly and need to reflect a
    # grant/revoke reasonably promptly, unlike mostly-static catalog data above.
    permissions:
      ttl-seconds: 30
      max-ttl-seconds: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100
