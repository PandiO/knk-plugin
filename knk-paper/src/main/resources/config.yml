api:
  # Base URL for the KnK backend API
  # TODO: Update this to match your backend server
  base-url: "http://localhost:5294/api"
  
  # Enable debug logging (logs every request/response: URL, latency, headers, body). Off by
  # default: it is noisy. The X-API-Key and Authorization values are redacted either way.
  debug-logging: false
  
  # Allow untrusted SSL certificates (ONLY for development with self-signed certs). Keep false
  # on any server that talks to the API over the internet.
  allow-untrusted-ssl: false
  
  # Authentication configuration (KNG-22)
  #
  # knk-web-api refuses game-server calls to its protected routes (balances, salary, kits,
  # presence, staff mode, freeze, ranks/permissions, account merge...) unless they carry its
  # shared key. Set api-key below to the SAME random value as the API's
  # Security:PluginApiKey (appsettings / environment variable Security__PluginApiKey), e.g.
  # generated with: openssl rand -hex 32
  # With the key the API also trusts the in-game staff member this plugin names for
  # audit-logged changes (X-Acting-User-Id).
  # The plugin won't start with type apikey and an empty api-key - that's deliberate.
  # (Development only: the API can be told to skip the check instead, see
  # Security:AllowUnauthenticatedPluginCalls in knk-web-api - then type none works.)
  auth:
    # Type: none, bearer, apikey
    type: apikey
    # Bearer token (only used if type=bearer)
    bearer-token: ""
    # API key (only used if type=apikey) - must equal knk-web-api's Security:PluginApiKey.
    # When set, the region HTTP server below also requires it (X-API-Key) on every request.
    api-key: ""
    # API key header name (only used if type=apikey). Keep X-API-Key: that's the header the
    # API reads.
    api-key-header: "X-API-Key"
  
  # HTTP timeouts (in seconds)
  timeouts:
    connect: 10
    read: 10
    write: 10

# Region HTTP server: knk-web-api calls it back for region renames and containment checks.
region-http:
  # Address to listen on. 127.0.0.1 (default) only accepts calls from this host. Use the Docker
  # host IP if the API runs in a container; never 0.0.0.0 on a public server.
  bind-address: "127.0.0.1"
  # Port to listen on (the API's region callback URL must use the same port).
  port: 8081

# Public web app, used in player messages (e.g. where to enter a /account link code).
web:
  # Base URL without a trailing slash, e.g. "https://app.knightsandkings.net". Empty: messages
  # leave the link out.
  public-url: ""

# Account management configuration (Phase 1+)
account:
  # Link code expiry time (in minutes)
  # How long a link code remains valid before expiring
  link-code-expiry-minutes: 20
  
  # Chat capture timeout (in seconds)
  # Maximum time to wait for player chat input during account creation
  chat-capture-timeout-seconds: 120
  
  # Command cooldowns (Phase 5) - Prevents spam and rate limits expensive operations
  cooldowns:
    # Cooldown for /account create command (seconds)
    # Prevents players from spamming account creation
    account-create-seconds: 300  # 5 minutes
    
    # Cooldown for generating link codes (seconds)
    # Rate limit for /account link (no args)
    link-code-generate-seconds: 60  # 1 minute
    
    # Cooldown for consuming link codes (seconds)
    # Rate limit for /account link <code>
    link-code-consume-seconds: 10  # 10 seconds
    
    # Cleanup interval for expired cooldowns (minutes)
    # How often to remove stale cooldown entries from memory
    cleanup-interval-minutes: 5

# WorldTask configuration
world-tasks:
  # How often the plugin polls the API for headless (player-less) WorldTasks
  headless-poll-interval-seconds: 5
  # Idle back-off: the interval doubles up to this value while no headless task is found
  # TODO: this pull-based polling (see HeadlessWorldTaskPoller) should eventually be replaced
  # by the API pushing a notification (e.g. SignalR) the moment a headless task is created,
  # removing the pickup-latency/idle-load trade-off these two settings exist to balance
  headless-poll-max-interval-seconds: 60

# Private messages: /msg, /reply and /socialspy (docs/specs/private-messages/DESIGN.md 3.3.10)
private-messages:
  # Longer messages (only possible from the console - the client caps a command at 256) are cut off
  max-length: 256
  # Played to the recipient
  sound:
    enabled: true
    volume: 1.0
    pitch: 1.0
  # At most max-messages per window-seconds per sender; the same text to the same player again
  # within duplicate-window-seconds counts as spam. Bypass: knk.msg.bypass.ratelimit
  rate-limit:
    max-messages: 5
    window-seconds: 5
    duplicate-window-seconds: 10
  spy:
    # How often the social spy audience (knk.socialspy / knk.socialspy.exempt holders) is re-checked
    refresh-seconds: 60
  log:
    # plugins/KnightsAndKings/logs/private-messages-YYYY-MM-DD.log
    local-enabled: true
    local-retention-days: 30
    # Server-side log in knk-web-api (30-day retention, staff read it with knk.pmlog.read). Needs
    # api.auth.type: apikey. Sent every flush-seconds or every 50 messages; if the API is down the
    # messages wait in memory (up to 1000) and in private-messages-spool.jsonl across a restart.
    api-enabled: true
    flush-seconds: 5
    # Keep "<player> issued server command: /msg ..." lines out of logs/latest.log (the PM log above
    # is the moderation record, with retention; the server log has none)
    filter-command-log: true
  # Route /minecraft:msg|tell|w through /msg and disable /teammsg, /tm and /me for non-ops, so they
  # can't bypass social spy, the rate limit and the log
  block-vanilla-commands: true

# In-game moments queued by the web API for writes made outside a plugin command - e.g. the
# promotion sound/particles/message when an admin grants XP from the web app's player profile
player-notifications:
  # How often the plugin polls the API for them (skipped while no players are online)
  poll-interval-seconds: 2

# Teleport engine (docs/specs/teleport/DESIGN.md §3.11, knk-workspace). Staff teleports (/tp,
# /tphere, /knk tp) are instant and skip warmup, cooldown, combat tag and the safe-spot check; the
# settings below apply to player teleports (/tpa, /tpahere, /spawn, /warp, /back).
teleport:
  # Seconds a player waits before teleporting; moving to another block or taking damage cancels it
  warmup-seconds: 5            # v1 default
  # Warmup for holders of knk.teleport.warmup.short (granted to the Noble premium tier and up)
  warmup-short-seconds: 3      # v1 premium
  # Seconds after a player teleport before the same kind of teleport can be used again. A permission
  # group can set its own cooldown for /tpa, /warp and /spawn in the web app (Linear KNG-41); that
  # replaces this value for its members.
  cooldown-seconds: 30
  # A PvP hit (dealt or taken) blocks player teleports for this long
  combat-tag-seconds: 10       # v1 Main.combat
  # How far (blocks) to look for a safe spot around an unsafe destination before refusing
  safe-search-radius: 3
  # Player teleport requests: /tpa (knk.teleport.request) and /tpahere (knk.teleport.request.here)
  request:
    # Seconds the target has to accept
    expire-seconds: 30         # v1
    # Seconds between two requests from the same player (knk.teleport.bypass.cooldown skips it)
    cooldown-seconds: 10
    # Pending requests one player can have; the oldest is dropped past this
    max-incoming: 5
    # Coins a request costs the requester (0 = free). Charged by the web API when the teleport
    # happens (after the warmup) and refunded if it then fails. The requester's permission group can
    # replace it in the web app (KNG-41: a multiple of this value, or a fixed price in coins, gems
    # and/or XP); /spawn and /warp can be priced there too.
    price-coins: 0             # v1 intended 10000, never charged
  # /warp <destination> and /warps (knk.teleport.warp): Towns, Districts and Structures staff
  # enabled as destinations in the web app. The web API checks the title / premium tier /
  # discovery requirements and takes the gem price after the warmup.
  destinations:
    # Seconds a player's destination list (names, prices, locks) is cached
    cache-seconds: 60
  # /back (Linear KNG-42): back to the latest place among the kinds the player's nodes allow -
  # where they died (knk.teleport.back, meant for Dragon Blood), or where they were before a /warp
  # (knk.teleport.back.warps), a /tpa, /tpahere or their own staff /tp (knk.teleport.back.teleport)
  # or a /spawn (knk.teleport.back.spawn); knk.teleport.back.all allows every kind. Each place is
  # single use. Warmup, cooldown, combat tag and the safe-spot check apply. Siege deaths and siege
  # teleports are never recorded; places from before a siege stay usable after it while they last.
  # Staff: /back <player> [-s] (knk.teleport.staff.back.others) - instant, audited, free.
  back:
    enabled: true
    # Seconds after the death or teleport during which /back can be started (every kind)
    expire-seconds: 300        # developer decision Q5: 5 minutes
    # Optional per-kind overrides of expire-seconds (death, warps, teleport, spawn)
    # expire-seconds-by-kind:
    #   warps: 600
    #   spawn: 120
    # Coins a player's own /back costs (0 = free; knk.teleport.bypass.cost pays nothing). Charged by
    # the web API when the teleport happens (after the warmup) and refunded if it then fails.
    price-coins: 0

# Domain discovery (Linear KNG-20, knk-workspace docs/specs/domain-discovery/DESIGN.md §3.6):
# the first time a player enters a Town, District or Structure it is recorded and rewarded once.
# knk-web-api decides everything that matters (which regions are domains, the amounts, the
# once-per-player rule, an hourly cap); these settings only control detection and effects.
# Players in staff/owner mode, frozen, still loading, in an excluded game mode or in a siege
# discover nothing - they discover a place the next time they are in it without being excluded.
discovery:
  enabled: true
  # How often (ticks) the regions players entered are sent to the API, one request per player
  batch-window-ticks: 20
  # At most this many discovery requests per player per minute; the rest waits
  max-requests-per-minute: 12
  excluded-game-modes: [CREATIVE, SPECTATOR]
  # Members of a siege lobby discover nothing from the hub teleport until they are restored after
  # the match; players only queued in matchmaking still discover
  exclude-siege-participants: true
  # Under the plugin folder: discoveries made while the API was unreachable, one file per
  # player, replayed every replay-interval-seconds and on the player's next join
  spool-directory: discovery-spool
  replay-interval-seconds: 60
  effects:
    # A Bukkit Sound name (or a namespaced sound key such as minecraft:ui.toast.challenge_complete)
    sound: UI_TOAST_CHALLENGE_COMPLETE
    sound-volume: 0.8
    sound-pitch: 1.0
    # A Bukkit Particle name that needs no extra data
    particle: HAPPY_VILLAGER
    particle-count: 30
    particle-spread: 0.6
    # An extra firework burst when a Town is discovered
    town-firework: true
    # Ticks between the effects of several places discovered at once (Town, then District, ...)
    spacing-ticks: 10
  messages:
    # One line per place, followed by its reward lines. {type} = "the town"/"the district"/...,
    # {parent} = " in &a<town>" for Districts and Structures (empty for a Town)
    discovered: "&bYou discovered {type} &a{name}&b{parent}!"
    # Shown instead when discoveries made while the API was down are granted later
    replay-summary: "&bWhile the server was busy you discovered &a{count}&b place(s):"

# Player payments (currency ledger Phase 3, docs/specs/currency-payments/DESIGN.md §3.6). Every
# limit that matters (min/max, daily caps, cooldown, confirmation threshold, who may send) lives in
# the API's currency policy; these only shape the in-game experience.
currency:
  # Pause between two /pay of one player, before even asking the API (the API has its own cooldown)
  client-cooldown-seconds: 3
  # Lines per /baltop page (max 50)
  baltop-page-size: 10
  # Lines per /transactions and /knk user <player> history page (max 50)
  transactions-page-size: 8

# Gate structure state synchronization
gates:
  # How often (seconds) the plugin pushes the current open/closed/destroyed state of every
  # gate to the API, as a safety net for state changes that were never persisted (e.g. a crash
  # mid-animation). The state is also pushed once immediately after every open/close animation
  # completes, and once more right before shutdown, so this interval can stay relatively long.
  state-sync-interval-seconds: 120
  # How often (seconds) the plugin scans every loaded world for orphaned (gate deleted) or
  # duplicate (e.g. left behind by a chunk unload/reload) gate info displays and repairs them.
  # Runs in addition to the one-shot cleanup at startup, so a duplicate that appears while the
  # server is running gets fixed without needing a restart.
  display-cleanup-interval-seconds: 60
  # Continuous damage ("fire") system: a gate door block set alight by a flaming projectile or
  # fire charge burns for fire-duration-seconds, dealing fire-damage-per-tick HealthCurrent
  # damage to its owning gate every fire-tick-interval-seconds for each door block still burning
  # (so several burning blocks stack damage). Health changes apply immediately in memory, so the
  # health display stays live; DB persistence is left to the existing state-sync-interval-seconds
  # sweep above rather than writing on every fire tick, to stay affordable during a siege with
  # several gates burning at once.
  fire-duration-seconds: 8
  fire-damage-per-tick: 2.0
  fire-tick-interval-seconds: 1
  # Pass-through system: InstantOpen mode removes only the door blocks within
  # passthrough-instant-open-radius-blocks of the triggering player's position (sideways, across
  # the gate's full depth), restoring them once the player crosses to the far side or after
  # passthrough-instant-open-timeout-seconds elapses (safety net if they turn back or disconnect).
  passthrough-instant-open-radius-blocks: 1
  passthrough-instant-open-timeout-seconds: 5
  # Rotation gap-fill (docs/features/gate-structure-animation/ROTATION_GAP_FILL_DESIGN.md):
  # Mechanism 1 automatically fills the checkerboard-sparse open-state footprint of a
  # diagonal-hinge ROTATION gate (e.g. a DRAWBRIDGE facing a diagonal direction) at its resting
  # closed/open endpoints, with zero admin action. It's unconditional once enabled - a defect
  # would affect every such gate on the server at once - so this is a kill switch (Decision 5):
  # set to false to fall back to the exact original sparse-lattice behavior server-wide, no
  # restart-affecting code deploy needed. A gate with its own manually-scanned open state
  # (Mechanism 2) is never affected either way - that always takes priority over this.
  rotationGapFill:
    rasterization-enabled: true
  # World/DB sync (docs/features/gate-structure-animation/GATE_WORLD_SYNC_DESIGN.md): a gate's
  # physical world blocks are kept converging on its DB-loaded state via three mechanisms - a
  # startup diagnostic pass (logs mismatches only, never forces a chunk load or a block write),
  # a check-and-fix pass the first time each district is entered (forces only that district's own
  # gates' chunks - see DistrictGateLoader), and this periodic health-check, which re-verifies a
  # small, round-robin batch of already-loaded gates every health-check-interval-seconds, never
  # forcing a chunk load itself - its cost tracks currently-active gates, not total gate count.
  world-sync:
    health-check-interval-seconds: 300
    health-check-batch-size: 15

# Messages configuration
messages:
  # Prefix for all plugin messages
  prefix: "&8[&6KnK&8] &r"
  
  # Account created successfully
  account-created: "&aAccount created successfully! You can now log in on the web app."
  
  # Accounts linked
  account-linked: "&aYour accounts have been linked!"
  
  # Link code generated (/account link). Placeholders: {code}, {minutes}, {url} (web.public-url).
  # \n starts a new chat line; lines that use {url} are left out while web.public-url is empty.
  link-code-generated: "&aYour link code is &6{code}&a. It expires in {minutes} minutes.\n&aNew to the website? Register at &e{url}/auth/register\n&aEnter the code when you register on the website, or on your Account page if you already have a web login."
  
  # Invalid or expired link code
  invalid-link-code: "&cThis code is invalid or has expired. Use &6/account link &cto get a new one."
  
  # Duplicate account detected
  duplicate-account: "&cYou have two accounts. Please choose which one to keep."
  
  # Merge complete
  merge-complete: "&aAccount merge complete. Your account now has {coins} coins, {gems} gems, and {exp} XP."

  # /pay, /balance, /baltop, /transactions (currency ledger Phase 3). Any key left out uses the
  # built-in default (CurrencySettings.DEFAULT_MESSAGES); the most visible ones are listed here.
  currency:
    pay-sent: "&aSent &6{amount} {currency} &ato &e{player}&a. Balance: &6{balance}"
    pay-received: "&aYou received &6{amount} {currency} &afrom &e{player}&a."
    pay-confirm: "&eSend &6{amount} {currency} &eto &e{player}&e? {confirm} {cancel} &7(expires in {seconds}s)"
    pay-insufficient: "&cYou only have &6{balance} {currency}&c."
    pay-cap: "&cDaily limit reached - you can send &6{remaining} &cmore {currency} (resets in {when})."
    pay-new-account: "&cYour account must be {hours}h old and reach {title} before sending {currency}."
    pay-not-transferable: "&c{Currency} can't be transferred."
    pay-self: "&cYou can't pay yourself."
    pay-unknown: "&cWe couldn't confirm the payment. Check &e/transactions &cbefore trying again."
    balance-self: "&7Balance: &6{coins} coins &7| &b{gems} gems"

# Permanent enchantment books (Linear KNG-5) - the v1 grade level cap (Linear KNG-6,
# knk-workspace docs/specs/items/GRADE_DROPCHANCE.md). An item of grade G may take an enchantment
# only up to definitionMaxLevel / divisor(G) (integer division, as v1). The divisors themselves are
# per-grade fields in the web app (Grade.EnchantLevelCapDivisor: 5,4,3,2,1 for 1-5 stars, empty =
# uncapped for 6-10 stars); the plugin re-reads them from the API every grade-refresh-minutes.
enchant-books:
  grade-cap:
    # false = no grade cap at all (books behave as before KNG-6)
    enabled: true
    # v1 never capped custom enchantments (Poison, Chaos, ...); true caps them like vanilla ones
    apply-to-custom: false
    # Grade assumed for items without one (vanilla-crafted, not from a graded blueprint).
    # 1 = most capped, so vanilla gear is no way around the cap; 0 = uncapped
    ungraded-stars: 1
    # Chance (0.0-1.0) that a book gives one bonus level, still within the cap. v1 rolled
    # nextInt(100) <= 20, which is really 21%; set 0.21 for the exact v1 odds, 0 to disable
    bonus-level-chance: 0.20
    # How often the grade table (divisors) is re-read from the API
    grade-refresh-minutes: 10

# Custom enchantments runtime settings
custom-enchantments:
  disable-for-creative: false
  cooldown-message: "&c%seconds% seconds remaining"
  messages:
    cmd-help-header: "&6Custom Enchantments Commands:"
    cmd-unknown: "&cUnknown subcommand."
    cmd-no-permission: "&cYou don't have permission to use this command."
    cmd-player-only: "&cThis command can only be executed by players."
    cmd-hand: "&cPlease put an item in your hand and run the command."
    cmd-hand-target: "&cTarget player must hold an item in main hand."
    cmd-invalid-level: "&cLevel must be a positive number."
    cmd-usage-add: "&eUsage: /ce add <enchantment> <level>"
    cmd-usage-remove: "&eUsage: /ce remove <enchantment>"
    cmd-usage-info: "&eUsage: /ce info [player]"
    cmd-usage-cooldown: "&eUsage: /ce cooldown clear [player]"
    cmd-unknown-enchantment: "&cUnknown enchantment: %enchantment%"
    cmd-add-success: "&aEnchantment was added to item successfully."
    cmd-add-level: "&cCannot add %enchantment%, max level is %lvl%."
    cmd-remove-success: "&aEnchantment was removed from item successfully."
    cmd-player-not-found: "&cCould not find player %player%."
    cmd-clear: "&aRemoved cooldowns for %player%."
    cmd-reload: "&aPlugin configuration was reloaded."
    cmd-info-header: "&6Custom enchantments on held item:"
    cmd-info-line: "&7- &f%name% %level% &8(id: %id%) &7cooldown: %cooldown%s"
    cmd-info-none: "&7No custom enchantments found on held item."
    ench-use: "&cYou cannot use %enchantment%."

# Cache configuration

# Lootboxes (docs/specs/lootboxes/DESIGN.md §3.4). Everything the API decides - areas, limits, odds, the daily cap,
# announcement templates - is set in the web app (/admin/lootboxes); this section is only how this server places,
# shows and opens boxes. /knk lootbox reload re-reads it.
lootboxes:
  enabled: true
  # Sent with every spawn so the drop log shows which server made the box.
  server-id: "default"
  runtime-refresh-seconds: 60      # runtime config + active boxes re-read from the API
  scheduler-tick-seconds: 20       # how often each area is considered (its own interval still applies)
  claim-max-distance: 5            # blocks between the player and the box
  full-inventory: refuse           # refuse (no claim with a full inventory) | drop-owned (claim, drop leftovers owner-locked)
  staff-mode-can-claim: false      # players in /staffmode or /ownermode can't open boxes
  surface:
    max-attempts-per-tick: 4       # random columns tried per area per try; ungenerated chunks are skipped
    forbidden-ground: [WATER, LAVA, MAGMA_BLOCK, CACTUS, POWDER_SNOW]
  display:
    # What a world box looks like: token = the token item you pick up by clicking it (token.material below);
    # type = the type's display material from the web app (its category icon).
    model: token
    label: true                    # floating "<colour><Grade> <Category> Lootbox ★★★" label
    rotate: true
    particles-radius: 15           # gold particles + a quiet chime every 4 s to players this close (0 = off)
    grade-colors: { "1": "&9", "2": "&9", "3": "&b", "4": "&b", "5": "&d", "6": "&6", "7": "&6", "8": "&c", "9": "&c", "10": "&4" }
  # Lootbox token items (right-click to open; picked up from world boxes, issued by /knk lootbox token, premium tiers
  # and kits). An item is a token only by its knightsandkings:knk_lootbox_token tag, never by material or name. Pick
  # something that isn't a fuel, a crafting ingredient or otherwise usable; placing and crafting with a token are
  # blocked anyway.
  token:
    material: ENDER_CHEST
  # Opening a token (right-click): a "wheel of fortune" menu whose middle row slows down and stops on the item the API
  # already rolled; the item goes into the inventory when it stops (or at once when the menu is closed early).
  opening:
    style: wheel                   # wheel | instant (give the item straight away)
    reel-steps: 32                 # items that scroll past the marker
    slowest-step-ticks: 8          # the last step's delay; the reel starts at 1 tick per step and eases out
    show-result-ticks: 50          # how long the menu stays open on the result
    public-effects: true           # particles and sounds at the player that others nearby see and hear
# Managed WorldGuard regions (docs/architecture/managed-worldguard-regions.md in knk-workspace).
# Knights and Kings gives every Town/District/Structure/Gate region its parent, priority and category flags when the region
# is created, and re-checks all of them at each startup. It only ever touches those three things; owners, members and
# every other flag (greetings, custom ones) stay as they are, and no region is created or deleted.
regions:
  managed:
    startup-repair:
      enabled: true
      delay-ticks: 100            # wait after enable so WorldGuard has loaded its regions
      attempts: 3                 # the API may still be starting; each attempt is retry-delay-seconds apart
      retry-delay-seconds: 30
      page-size: 100              # rows per API request while reading Towns, Districts and Structures
    # v1's resource structure (property_47, wood farm) let anyone break blocks in it, limited to logs by a custom
    # allow-blocks flag WorldGuard does not have. Turning this on sets block-break=allow on RESOURCE_PRODUCTION regions
    # WITHOUT that restriction, so leave it off until a v3 block filter exists.
    resource-production-block-break: false
    # Apply v1's __global__ flags (build deny, pvp allow, ...). Changes what is buildable across the whole world.
    manage-global-region: false
    # Per-region corrections, by WorldGuard region id. Use them to say what a Structure is (the API has no House/Property
    # subtype yet), to record an exact v1 priority, or to add a one-off flag. Flags here are only set while absent.
    #   kinds: town, district, structure, house, property, resource_production, room, gate, arena, battleground
    overrides: {}
    #  domain_47:
    #    kind: resource_production
    #    priority: 35
    #    flags: { block-break: allow }
    # Regions with no v3 domain (arenas, battlegrounds) that should still get a parent, priority and flags.
    extra-regions: []
    #  - { region: arena_2, kind: arena, parent: district_2 }
    #  - { region: arena_2-battleground, kind: battleground, parent: arena_2 }
cache:
  # Global time-to-live for cached API responses (in seconds)
  # After this duration, cached data is considered stale and will be refetched
  # Recommended: 60-300 seconds (1-5 minutes) depending on data freshness requirements
  ttl-seconds: 60
  
  # Per-entity cache and data access settings (overrides global TTL and policy defaults)
  entities:
    users:
      ttl-minutes: 15          # Cache TTL (minutes)
      max-ttl-minutes: 60      # Maximum allowed TTL
      default-policy: CACHE_FIRST  # Default fetch policy (CACHE_ONLY, CACHE_FIRST, API_ONLY, API_THEN_CACHE_REFRESH, STALE_OK)
      allow-stale: true        # Allow serving stale data
      retry-attempts: 3        # Max retry attempts for API failures
      retry-backoff-ms: 100    # Initial retry delay (milliseconds)
    
    towns:
      ttl-minutes: 30
      max-ttl-minutes: 240
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100
    
    districts:
      ttl-minutes: 30
      max-ttl-minutes: 240
