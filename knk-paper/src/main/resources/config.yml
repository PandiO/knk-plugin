    # Siege runtime-config (lobbies + resolved scenarios + SiegeConfiguration), one cache entry.
    # A lobby's config is frozen during a match and refreshed only between matches, so the TTL
    # just bounds how old a cache-first read may be (Siege Phase 4, SiegeDataAccess).
    siege:
      ttl-minutes: 30
      max-ttl-minutes: 240
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 200

    health:
      ttl-seconds: 30          # Health uses seconds (short TTL)
      max-ttl-seconds: 120
      default-policy: CACHE_FIRST
      allow-stale: false       # Don't serve stale health checks
      retry-attempts: 2        # Fewer retries for health checks
      retry-backoff-ms: 50

    menus:
      ttl-minutes: 20
      max-ttl-minutes: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100

    # user-features permission system (docs/specs/user-features/IMPLEMENTATION_PLAN.md §1).
    # Short TTL like health - permission checks happen constantly and need to reflect a
    # grant/revoke reasonably promptly, unlike mostly-static catalog data above.
    permissions:
      ttl-seconds: 30
      max-ttl-seconds: 120
      default-policy: CACHE_FIRST
      allow-stale: true
      retry-attempts: 3
      retry-backoff-ms: 100
