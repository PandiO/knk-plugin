name: KnightsAndKings
api: "1.21"
version: 0.1.0
main: net.knightsandkings.knk.paper.KnKPlugin
api-version: "1.21"
depend:
  - WorldGuard
softdepend:
  - WorldEdit
  
commands:
  knk:
    description: KnK admin and debug commands
    usage: /knk help
    # No top-level permission gate (docs/specs/user-features/DESIGN.md §2.3/§6.1): each
    # subcommand is gated individually on its own knk.admin.<subcommand> node (checked in
    # KnkAdminCommand#onCommand), so a holder of just one subcommand's node - not the knk.admin
    # umbrella - can still reach /knk at all. Gating the whole command behind knk.admin here
    # would make that per-subcommand granularity unreachable.

  account:
    description: "Manage your in-game account (create, link, view status)"
    usage: "/account [create|link|status]"
    aliases: [acc]
    permission: knk.account.use

  ownermode:
    description: "Toggle owner mode (vanish from non-staff players; persists across restarts)"
    usage: "/ownermode [on|off] [onquit] | /ownermode help"
    aliases: [om]
    # No permission: here - gated on knk.mode.owner through KnkPermissible inside ModeCommand,
    # for the same reason /knk has none (Bukkit would check its own permission tree first).

  staffmode:
    description: "Toggle staff mode (vanish from non-staff players; persists across restarts)"
    usage: "/staffmode [on|off] [onquit] | /staffmode help"
    aliases: [sm]
    # No permission: here - gated on knk.mode.staff through KnkPermissible inside ModeCommand.

  ce:
    description: "Manage custom enchantments on held item"
    usage: "/ce <add|remove|info|cooldown|reload>"
    aliases: [customench]
    permission: customenchantments.command.use

  freeze:
    description: "Freeze a player - locks movement/chat/commands/damage until unfrozen (rebuild of v1's FreezeCommands, a dead no-op stub there)"
    usage: "/freeze <player> <reason...>"
    permission: knk.freeze

  unfreeze:
    description: "Unfreeze a previously-frozen player"
    usage: "/unfreeze <player>"
    permission: knk.unfreeze

  staffchat:
    description: "Broadcast a message to online staff (rebuild of v1's StaffChatCommand)"
    usage: "/staffchat <message>"
    aliases: [sc]
    permission: knk.staffchat

  msg:
    description: "Send a private message to another player (rebuild of v1's MessageCommands)"
    usage: "/msg <player> <message>"
    aliases: [tell, w]
    # No permission gate - matches v1's player-to-player intent (any player may message another).

  reply:
    description: "Reply to the last player who messaged you"
    usage: "/reply <message>"
    aliases: [r]
    # No permission gate - same as /msg.

  kit:
    description: "List, claim, give, and purchase Kits (docs/specs/kits/DESIGN.md §4.3)"
    usage: "/kit list | /kit get <name> | /kit give <player> <name> | /kit purchase <name> | /kit manage ..."
    # No permission: here - each subcommand is gated individually on its own knk.kit.<action>
    # node through KnkPermissible inside KitCommand, same reasoning /knk and /ownermode|/staffmode
    # have none (Bukkit would check its own permission tree before this executor ever ran).

  siege:
    description: "Siege minigame: lobbies, join/leave, vote, spawn choice, admin controls (docs/specs/siege-minigame/DESIGN.md §11.1)"
    usage: "/siege [join|leave|menu|info|vote|spawn|skip|admin] ..."
    # No permission: here - each subcommand is gated on its own knk.siege.* node through
    # KnkPermissible inside SiegeCommand, same reasoning as /kit and /knk.

  siegemenu:
    description: "Open your siege menu while you are in a siege (same as /siege menu)"
    usage: "/siegemenu"
    aliases: [sgm]
    # /sm is /staffmode's alias. Gated on knk.siege.play inside SiegeCommand.

  menu:
    description: "Open the Knights and Kings menu (InventoryMenu hub, docs/specs/inventory-menu/CONTENT_PORT_PLAN.md §3)"
    usage: "/menu"
    permission: knk.menu

  # KNG-9: v2 player commands ported to v3 (docs/specs/legacy/commands-v2.md §1/§7). None has a
  # permission: entry - /user statistics is open to everyone, and the others check their knk.<cmd>
  # nodes through KnkPermissible inside the executor (same reasoning as /kit and /ownermode).
  user:
    description: "Show your statistics, or another player's"
    usage: "/user statistics [player]"
    aliases: [u]

  stats:
    description: "Show your statistics, or another player's (same as /user statistics)"
    usage: "/stats [player]"

  fly:
    description: "Toggle or set flight for yourself or an online player"
    usage: "/fly [on|off] [player]"

  heal:
    description: "Heal yourself, an online player, or everyone online"
    usage: "/heal [player|all]"

  feed:
    description: "Feed yourself, an online player, or everyone online"
    usage: "/feed [player|all]"

  enderchest:
    description: "Open your ender chest, or an online player's"
    usage: "/enderchest [player]"
    aliases: [ec]

  inventory:
    description: "Open or clear an online player's inventory"
    usage: "/inventory open <player> | /inventory clear <player> confirm"
    aliases: [inv, invsee]

permissions:
  knk.admin:
    description: >-
      Umbrella node for all /knk admin subcommands (docs/specs/user-features/DESIGN.md §2.3).
      Granting this still grants every knk.admin.<subcommand> child below, so existing
      op-based grants keep working unchanged; a future group/grant can instead assign just
      one child node for finer-grained access. /knk gate is deliberately not one of these
      children - its own subactions are already individually gated (knk.gate.admin,
      knk.gate.open.*, knk.gate.close.*, etc.), which is finer-grained than a single node.
    default: op
    children:
      knk.admin.health: true
      knk.admin.cache: true
      knk.admin.clans: true
      knk.admin.towns: true
      knk.admin.town: true
      knk.admin.districts: true
      knk.admin.district: true
      knk.admin.locations: true
      knk.admin.location: true
      knk.admin.enchantments: true
      knk.admin.itemblueprints: true
      knk.admin.menu: true
      knk.admin.streets: true
      knk.admin.street: true
      knk.admin.user.info: true
      knk.admin.user.coins: true
      knk.admin.user.gems: true
      knk.admin.user.xp: true
      knk.admin.user.group: true
      knk.admin.user.perm: true
      knk.admin.user.manage: true
      knk.admin.user.manage.all: true
      knk.admin.user.mode: true
      knk.admin.user.salary: true
      knk.admin.tp: true

  knk.admin.health:
    description: Access to /knk health
    default: false

  knk.admin.cache:
    description: Access to /knk cache
    default: false

  knk.admin.clans:
    description: Access to /knk clans (Siege Phase 1 clan/banner inspection)
    default: false

  knk.admin.towns:
    description: Access to /knk towns
    default: false

  knk.admin.town:
    description: Access to /knk town
    default: false

  knk.admin.districts:
    description: Access to /knk districts
    default: false

  knk.admin.district:
    description: Access to /knk district
    default: false

  knk.admin.locations:
    description: Access to /knk locations
    default: false

  knk.admin.location:
    description: Access to /knk location
    default: false

  knk.admin.enchantments:
    description: Access to /knk enchantments
    default: false

  knk.admin.itemblueprints:
    description: Access to /knk itemblueprints
    default: false

  knk.admin.menu:
    description: Access to /knk menu (InventoryMenu dev harness)
    default: false

  knk.admin.streets:
    description: Access to /knk streets
    default: false

  knk.admin.street:
    description: Access to /knk street
    default: false

  knk.admin.user.manage:
    description: >-
      Open the in-game Player manager (InventoryMenu users.manager, content port CP8) and see its
      hub tile. Every edit inside it is still gated by its own knk.admin.user.<property> node.
    default: false

  knk.admin.user.manage.all:
    description: >-
      Owner override (menu follow-up 2026-09-26): the Player manager lists every player, online and
      offline (searchable), including yourself, and user edits - menu and /knk user - skip the
      rank check (RankHierarchy). The per-property knk.admin.user.<property> nodes still apply.
    default: op

  knk.admin.user.mode:
    description: >-
      Switch another player's staff mode from the in-game Player manager (content port CP8).
      Only to a mode the target holds the node for; owner mode is only set by its holder.
    default: false

  knk.admin.user.salary:
    description: Pay out another player's outstanding salary from the in-game Player manager (content port CP8).
    default: false

  knk.admin.user.info:
    description: View a player's coins/gems/XP/title via /knk user <player> info
    default: false

  knk.admin.user.coins:
    description: Adjust a player's coin balance via /knk user <player> coins set|add|remove
    default: false

  knk.admin.user.gems:
    description: Adjust a player's gem balance via /knk user <player> gems set|add|remove
    default: false

  knk.admin.user.xp:
    description: Adjust a player's XP (and, indirectly, title) via /knk user <player> xp set|add|remove
    default: false

  knk.admin.user.group:
    description: >-
      Add/remove a player's PermissionGroup membership via /knk user <player> group add|remove
      <groupName> [duration]. Requires the actor's highest group weight to exceed the target's
      (RankHierarchy) - cannot act on an equal-or-higher-ranked player.
    default: false

  knk.admin.user.perm:
    description: >-
      Grant/revoke a permission node directly on a player via /knk user <player> perm
      grant|revoke <node> [duration] - e.g. granting knk.mode.staff. Hierarchy-checked, same as
      knk.admin.user.group.
    default: false

  knk.admin.tp:
    description: Teleport to an online player via /knk tp <player>. Hierarchy-checked (RankHierarchy).
    default: false

  knk.tasks:
    description: Access to /knk tasks, /knk task-claim, /knk task-status (world task management)
    default: op

  knk.mode.owner:
    description: >-
      Owner-mode status (docs/specs/user-features/DESIGN.md §6.1), replacing the dead legacy
      k&k.join.owner/k&k.owner/k&k.* checks. Resolved through the new REST-backed permission
      model via KnkPermissible, not through Bukkit's own permission tree - this plugin.yml
      declaration is for documentation/consistency only and isn't what KnkPermissible actually
      checks. It does still bypass via KnkPermissible's own op check: a Minecraft-op'd player
      short-circuits to allowed on every node, same as Bukkit's own default for an undeclared
      permission. A non-op needs a real PermissionGrant or group membership (authoring UI is
      docs/specs/user-features/IMPLEMENTATION_PLAN.md §6.2, a later phase) - until one exists,
      this node resolves undeclared and fails closed for that player. Gates /ownermode; holders
      (like knk.mode.staff holders) can also see players vanished in owner/staff mode.
    default: op

  knk.mode.staff:
    description: >-
      Staff-mode status (docs/specs/user-features/DESIGN.md §6.1), replacing v1's k&k.staff. Gates
      /staffmode, and holders can see players vanished in owner/staff mode. Resolved through the
      new REST-backed permission model via KnkPermissible, not through Bukkit's own permission
      tree - this plugin.yml declaration is for documentation/consistency only and isn't what
      KnkPermissible actually checks. It does still bypass via KnkPermissible's own op check: a
      Minecraft-op'd player short-circuits to allowed on every node, same as Bukkit's own default
      for an undeclared permission. A non-op needs a real PermissionGrant or group membership
      (authoring UI is docs/specs/user-features/IMPLEMENTATION_PLAN.md §6.2, a later phase) -
      until one exists, this node resolves undeclared and fails closed for that player.
    default: op

  knk.kit.list:
    description: >-
      List available kits via /kit list (docs/specs/kits/DESIGN.md §4.3). Resolved through the
      new REST-backed permission model via KnkPermissible, not through Bukkit's own permission
      tree - this plugin.yml declaration is for documentation/consistency only and isn't what
      KnkPermissible actually checks. A Minecraft-op'd player short-circuits to allowed on every
      node via KnkPermissible's own op check; a non-op needs a real PermissionGrant or group
      membership, until which this node resolves undeclared and fails closed.
    default: op

  knk.kit.get:
    description: >-
      Self-claim a kit via /kit get <name> (docs/specs/kits/DESIGN.md §4.3). Same
      KnkPermissible/op-bypass caveat as knk.kit.list.
    default: op

  knk.kit.give:
    description: >-
      Staff-give a kit to another player via /kit give <player> <name>, bypassing the
      recipient's own gating/cooldown/cost (docs/specs/kits/DESIGN.md §0b/§4.1/§4.3). Same
      KnkPermissible/op-bypass caveat as knk.kit.list.
    default: op

  knk.kit.purchase:
    description: >-
      Purchase a single-purchase-premium kit via /kit purchase <name> (docs/specs/kits/
      DESIGN.md §4.3/§5.2). Same KnkPermissible/op-bypass caveat as knk.kit.list.
    default: op

  knk.kit.manage:
    description: >-
      Gates /kit manage's FormWizard-pointer subcommands (docs/specs/kits/DESIGN.md §0c/§4.5) -
      no in-game Kit CRUD exists, this only guards advertising the FormWizard route to players
      with no reason to see it. Same KnkPermissible/op-bypass caveat as knk.kit.list.
    default: op

  # KNG-9 player commands. Resolved through KnkPermissible (the REST-backed permission model), not
  # Bukkit's permission tree - these declarations document the nodes; the same caveat as knk.kit.list
  # applies (ops pass via KnkPermissible's op bypass, non-ops need a real grant or group membership).
  # Wildcards work in grants, e.g. knk.heal.* covers knk.heal, knk.heal.others and knk.heal.all.
  knk.fly:
    description: Toggle your own flight with /fly (KNG-9).
    default: op

  knk.fly.others:
    description: Toggle or set an online player's flight with /fly [on|off] <player> (KNG-9).
    default: op

  knk.heal:
    description: Heal yourself with /heal (KNG-9).
    default: op

  knk.heal.others:
    description: Heal an online player with /heal <player> (KNG-9).
    default: op

  knk.heal.all:
    description: Heal every online player with /heal all (KNG-9).
    default: op

  knk.feed:
    description: Feed yourself with /feed (KNG-9). Its own node - v2's /feed wrongly checked the /heal nodes.
    default: op

  knk.feed.others:
    description: Feed an online player with /feed <player> (KNG-9).
    default: op

  knk.feed.all:
    description: Feed every online player with /feed all (KNG-9).
    default: op

  knk.enderchest:
    description: Open your own ender chest with /enderchest (/ec) (KNG-9).
    default: op

  knk.enderchest.open:
    description: Open an online player's ender chest with /enderchest <player> (KNG-9). Rank-checked (RankHierarchy).
    default: op

  knk.inventory.open:
    description: Open (and edit) an online player's inventory with /inventory open <player> (KNG-9). Rank-checked (RankHierarchy).
    default: op

  knk.inventory.clear:
    description: Clear an online player's inventory with /inventory clear <player> confirm (KNG-9). Rank-checked (RankHierarchy) unless it's your own.
    default: op

  knk.freeze:
    description: >-
      Freeze a player via /freeze <player> <reason> - locks their movement, chat, commands, and
      damage until unfrozen. Persisted server-side so it applies even to an offline target and
      takes effect on their next join. Hierarchy-checked (RankHierarchy) - cannot freeze an
      equal-or-higher-ranked player.
    default: false

  knk.unfreeze:
    description: Unfreeze a player via /unfreeze <player>. Hierarchy-checked, same as knk.freeze.
    default: false

  knk.staffchat:
    description: >-
      Send and receive /staffchat (/sc) broadcasts. Also determines who receives the /msg
      "social spy" broadcast (every private message is echoed to holders of this node).
    default: op

  knk.gate.open.*:
    description: Permission to open any gate
    default: false
    
  knk.gate.close.*:
    description: Permission to close any gate
    default: false

  knk.gate.passthrough.use:
    description: Base permission to trigger any gate pass-through mode by right-clicking a closed, pass-through-enabled gate
    default: false

  knk.gate.passthrough.instant:
    description: Extra permission required to use the InstantOpen gate pass-through mode
    default: false

  knk.gate.admin:
    description: Permission to use admin gate commands. Also grants full, unconditional gate pass-through access (bypasses AllowPassThrough and mode permissions).
    default: op
    children:
      knk.gate.open.*: true
      knk.gate.close.*: true
      knk.gate.passthrough.use: true
      knk.gate.passthrough.instant: true

  # Account management permissions (Phase 4+)
  knk.account.use:
    description: Ability to use /account command (view status)
    default: true

  knk.account.create:
    description: Create account with email/password via /account create
    default: true
    
  knk.account.link:
    description: Generate or consume link codes via /account link
    default: true

  knk.account.admin:
    description: Admin account management (future view/modify other players' accounts)
    default: op

  customenchantments.command.use:
    description: Allows use of /ce root command
    default: true

  customenchantments.command.add:
    description: Allows adding custom enchantments with /ce add
    default: op

  customenchantments.command.remove:
    description: Allows removing custom enchantments with /ce remove
    default: op

  customenchantments.command.info:
    description: Allows viewing custom enchantments with /ce info
    default: true

  customenchantments.command.info.others:
    description: Allows viewing other players' item enchantments with /ce info <player>
    default: op

  customenchantments.command.cooldown.clear:
    description: Allows clearing your own enchantment cooldowns
    default: op

  customenchantments.command.cooldown.clear.others:
    description: Allows clearing other players' enchantment cooldowns
    default: op

  customenchantments.command.reload:
    description: Allows reloading custom enchantment config with /ce reload
    default: op

  # Siege minigame (docs/specs/siege-minigame/DESIGN.md §11.1). Checked through KnkPermissible, like
  # the kit nodes: these declarations are documentation, an op short-circuits to allowed, and a
  # non-op needs a PermissionGrant/group membership. DESIGN §11.1: no Bukkit default beyond
  # knk.siege.play.
  knk.siege.play:
    description: Play sieges - /siege, join, leave, info, vote, spawn
    default: true

  knk.siege.skip:
    description: Skip a lobby's cooldown with /siege skip (v1 donator perk; grant to a premium group)
    default: false

  knk.siege.admin.list:
    description: /siege admin list - every lobby with phase, lock and members
    default: false

  knk.siege.admin.control:
    description: /siege admin start|stop|skip|kick - start matchmaking, abort (restore, no rewards), skip, remove a member
    default: false

  knk.siege.admin.reload:
    description: /siege admin reload - refresh the runtime config for lobbies not in a match
    default: false

  knk.siege.admin.manage:
    description: /siege admin manage - pointer to the web-app forms (no in-game editing)
    default: false

  knk.siege.bypass.commands:
    description: Run any command while in a siege match (bypasses SiegeConfiguration.AllowedCommands, DESIGN §6.9)
    default: false

  knk.siege.bypass.lockdown:
    description: Enter a scenario area that is locked down for a running siege (DESIGN §8.5)
    default: false

  knk.menu:
    description: Open the InventoryMenu hub with /menu (content port CP1).
    default: true
