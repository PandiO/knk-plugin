name: KnightsAndKings
api: "1.21"
version: 0.1.0
main: net.knightsandkings.knk.paper.KnKPlugin
api-version: "1.21"
depend:
  - WorldGuard
softdepend:
  - WorldEdit
  
commands:
  knk:
    description: KnK admin and debug commands
    usage: /knk help
    # No top-level permission gate (docs/specs/user-features/DESIGN.md §2.3/§6.1): each
    # subcommand is gated individually on its own knk.admin.<subcommand> node (checked in
    # KnkAdminCommand#onCommand), so a holder of just one subcommand's node - not the knk.admin
    # umbrella - can still reach /knk at all. Gating the whole command behind knk.admin here
    # would make that per-subcommand granularity unreachable.

  account:
    description: "Manage your in-game account (create, link, view status)"
    usage: "/account [create|link|status]"
    aliases: [acc]
    permission: knk.account.use

  ownermode:
    description: "Toggle owner mode (vanish from non-staff players; persists across restarts)"
    usage: "/ownermode [on|off] [onquit] | /ownermode help"
    aliases: [om]
    # No permission: here - gated on knk.mode.owner through KnkPermissible inside ModeCommand,
    # for the same reason /knk has none (Bukkit would check its own permission tree first).

  staffmode:
    description: "Toggle staff mode (vanish from non-staff players; persists across restarts)"
    usage: "/staffmode [on|off] [onquit] | /staffmode help"
    aliases: [sm]
    # No permission: here - gated on knk.mode.staff through KnkPermissible inside ModeCommand.

  ce:
    description: "Manage custom enchantments on held item"
    usage: "/ce <add|remove|info|cooldown|reload>"
    aliases: [customench]
    permission: customenchantments.command.use

  freeze:
    description: "Freeze a player - locks movement/chat/commands/damage until unfrozen (rebuild of v1's FreezeCommands, a dead no-op stub there)"
    usage: "/freeze <player> <reason...>"
    # No permission: here (KNG-24) - gated on knk.freeze through KnkPermissible inside the executor
    # and hidden from players lacking it by GatedCommandVisibilityListener.

  unfreeze:
    description: "Unfreeze a previously-frozen player"
    usage: "/unfreeze <player>"
    # No permission: here (KNG-24) - gated on knk.unfreeze through KnkPermissible inside the executor
    # and hidden from players lacking it by GatedCommandVisibilityListener.

  staffchat:
    description: "Broadcast a message to online staff (rebuild of v1's StaffChatCommand)"
    usage: "/staffchat <message>"
    aliases: [sc]
    # No permission: here (KNG-24) - gated on knk.staffchat through KnkPermissible inside the executor
    # and hidden from players lacking it by GatedCommandVisibilityListener.

  msg:
    description: "Send a private message to another player (rebuild of v1's MessageCommands)"
    usage: "/msg <player> <message>"
    aliases: [message, tell, whisper, w, m, pm]
    # No permission gate - matches v1's player-to-player intent (any player may message another).
    # Works for the console too.

  reply:
    description: "Reply to the last player who messaged you"
    usage: "/reply <message>"
    aliases: [r]
    # No permission gate - same as /msg.

  socialspy:
    description: "Turn the social spy feed (other players' private messages) on or off"
    usage: "/socialspy [on|off]"
    aliases: [spy]
    # No permission: here - gated on knk.socialspy through KnkPermissible inside SocialSpyCommand.

  ignore:
    description: "List who you ignore, or ignore/unignore a player (their private messages and chat)"
    usage: "/ignore [player]"
    # No permission gate - any player may ignore another. Works for offline players; staff holding
    # knk.msg.unignorable can't be ignored. The list is stored by knk-web-api.

  unignore:
    description: "Stop ignoring a player"
    usage: "/unignore <player>"

  kit:
    description: "List, claim, give, and purchase Kits (docs/specs/kits/DESIGN.md §4.3)"
    usage: "/kit list | /kit get <name> | /kit give <player> <name> | /kit purchase <name> | /kit manage ..."
    # No permission: here - each subcommand is gated individually on its own knk.kit.<action>
    # node through KnkPermissible inside KitCommand, same reasoning /knk and /ownermode|/staffmode
    # have none (Bukkit would check its own permission tree before this executor ever ran).

  # Currency ledger Phase 3 (docs/specs/currency-payments/DESIGN.md §3.6). No permission: entry -
  # each checks its knk.pay / knk.balance / knk.baltop / knk.transactions node through
  # KnkPermissible inside the executor (same reasoning as /kit); the API decides everything else.
  pay:
    description: "Pay another player coins (large amounts ask for confirmation)"
    usage: "/pay <player> <amount> [coins|gems] | /pay confirm|cancel [id]"

  balance:
    description: "Show your coins and gems, or another player's"
    usage: "/balance [player]"
    aliases: [bal, money]

  baltop:
    description: "Show the richest players"
    usage: "/baltop [coins|gems] [page]"

  transactions:
    description: "Show your coin, gem and XP history, or another player's"
    usage: "/transactions [player] [coins|gems|xp] [page]"
    aliases: [tx]

  siege:
    description: "Siege minigame: lobbies, join/leave, vote, spawn choice, admin controls (docs/specs/siege-minigame/DESIGN.md §11.1)"
    usage: "/siege [join|leave|menu|info|vote|spawn|skip|admin] ..."
    # No permission: here - each subcommand is gated on its own knk.siege.* node through
    # KnkPermissible inside SiegeCommand, same reasoning as /kit and /knk.

  siegemenu:
    description: "Open your siege menu while you are in a siege (same as /siege menu)"
    usage: "/siegemenu"
    aliases: [sgm]
    # /sm is /staffmode's alias. Gated on knk.siege.play inside SiegeCommand.

  menu:
    description: "Open the Knights and Kings menu (InventoryMenu hub, docs/specs/inventory-menu/CONTENT_PORT_PLAN.md §3)"
    usage: "/menu"
    permission: knk.menu

  discoveries:
    description: "See the towns, districts and structures you have discovered (docs/specs/domain-discovery DESIGN.md §3.7)"
    usage: "/discoveries"
    aliases: [disc]
    permission: knk.discoveries

  # KNG-9: v2 player commands ported to v3 (docs/specs/legacy/commands-v2.md §1/§7). None has a
  # permission: entry - /user statistics is open to everyone, and the others check their knk.<cmd>
  # nodes through KnkPermissible inside the executor (same reasoning as /kit and /ownermode).
  user:
    description: "Show your statistics, or another player's"
    usage: "/user statistics [player]"
    aliases: [u]

  stats:
    description: "Show your statistics, or another player's (same as /user statistics)"
    usage: "/stats [player]"

  fly:
    description: "Toggle or set flight for yourself or an online player"
    usage: "/fly [on|off] [player]"

  heal:
    description: "Heal yourself, an online player, or everyone online"
    usage: "/heal [player|all]"

  feed:
    description: "Feed yourself, an online player, or everyone online"
    usage: "/feed [player|all]"

  enderchest:
    description: "Open your ender chest, or an online player's"
    usage: "/enderchest [player]"
    aliases: [ec]

  inventory:
    description: "Open or clear an online player's inventory"
    usage: "/inventory open <player> | /inventory clear <player> confirm"
    aliases: [inv, invsee]

  # Teleport commands (docs/specs/teleport/DESIGN.md §3.2, KNG-17). Declaring tp here makes the bare
  # /tp label resolve to this plugin (developer decision 2026-09-26); vanilla stays reachable as
  # /minecraft:tp. No permission: entries - the knk.teleport.* nodes are checked through
  # KnkPermissible inside StaffTeleportCommand (same reasoning as /kit and /fly).
  tp:
    description: "Staff teleport: to a player, a player to a player, or to coordinates"
    usage: "/tp <player> [-s] | /tp <player> <target> [-s] | /tp <x> <y> <z> [world] [yaw pitch]"

  tphere:
    description: "Staff teleport: bring a player to you"
    usage: "/tphere <player> [-s]"

  # Player teleport requests (DESIGN.md §3.5, Phase 3). Nodes checked in TeleportRequestCommand.
  tpa:
    description: "Ask to teleport to a player (or /tpa accept|deny [player])"
    usage: "/tpa <player> | /tpa accept|deny [player]"

  tpahere:
    description: "Ask a player to teleport to you"
    usage: "/tpahere <player>"

  tpaccept:
    description: "Accept a teleport request (the newest, or the named player's)"
    usage: "/tpaccept [player]"
    aliases: [tpyes]

  tpdeny:
    description: "Deny a teleport request (the newest, or the named player's)"
    usage: "/tpdeny [player]"
    aliases: [tpno]

  tpcancel:
    description: "Withdraw your teleport request, or stop your running teleport"
    usage: "/tpcancel"

  # Server spawn (DESIGN.md §3.6, Phase 4) - the spawn set on the web-app Game Settings page, else
  # the main world's spawn. Nodes checked in SpawnCommand.
  spawn:
    description: "Teleport to the server spawn, or send a player there"
    usage: "/spawn | /spawn <player> [-s]"

  # Domain teleports (DESIGN.md §3.7, Phase 5) - Towns/Districts/Structures enabled as destinations
  # in the web app. Nodes checked in WarpCommand; the web API checks requirements and the price.
  warp:
    description: "Open the teleport menu, teleport to a town, district or structure, or send a player there"
    usage: "/warp | /warp <destination> | /warp list | /warp <destination> <player> [-s]"
    aliases: [point]

  warps:
    description: "List the places you can teleport to with /warp"
    usage: "/warps"

  # Back to the latest death or teleport origin your nodes allow (DESIGN.md Phase 7, KNG-42); staff
  # /back <player> [-s]. Nodes checked in BackCommand.
  back:
    description: "Teleport back to where you died, or were before a warp, teleport or /spawn (for a few minutes)"
    usage: "/back | /back <player> [-s]"
  lootbox:
    description: "Lootboxes: help, and what a box can give (docs/specs/lootboxes/DESIGN.md §3.4)"
    usage: "/lootbox | /lootbox odds <category> [stars]"
    aliases: [lb]
    # Player-only; odds is gated on knk.lootbox.odds through KnkPermissible inside LootboxCommand. Every admin
    # action is under /knk lootbox (knk.lootbox.admin.*), not here.

permissions:
  knk.admin:
    description: >-
      Umbrella node for all /knk admin subcommands (docs/specs/user-features/DESIGN.md §2.3).
      Granting this still grants every knk.admin.<subcommand> child below, so existing
      op-based grants keep working unchanged; a future group/grant can instead assign just
      one child node for finer-grained access. /knk gate is deliberately not one of these
      children - its own subactions are already individually gated (knk.gate.admin,
      knk.gate.open.*, knk.gate.close.*, etc.), which is finer-grained than a single node.
    default: op
    children:
      knk.admin.health: true
      knk.admin.cache: true
      knk.admin.regions: true
      knk.admin.clans: true
      knk.admin.towns: true
      knk.admin.town: true
      knk.admin.districts: true
      knk.admin.district: true
      knk.admin.locations: true
      knk.admin.location: true
      knk.admin.enchantments: true
      knk.admin.itemblueprints: true
      knk.admin.menu: true
      knk.admin.streets: true
      knk.admin.street: true
      knk.admin.user.info: true
      knk.admin.user.coins: true
      knk.admin.user.gems: true
      knk.admin.user.xp: true
      knk.admin.user.group: true
      knk.admin.user.perm: true
      knk.admin.user.manage: true
      knk.admin.user.manage.all: true
      knk.admin.user.mode: true
      knk.admin.user.salary: true
      knk.admin.user.history: true
      knk.admin.tp: true
      knk.admin.discovery: true
      knk.admin.currency: true

  knk.admin.health:
    description: Access to /knk health
    default: false

  knk.admin.regions:
    description: Access to /knk regions repair (re-applies the managed WorldGuard parent, priority and flags to every Knights and Kings region)
    default: false

  knk.admin.cache:
    description: Access to /knk cache (statistics) and /knk cache refresh (drops cached settings such as the /spawn destination)
    default: false

  knk.admin.clans:
    description: Access to /knk clans (Siege Phase 1 clan/banner inspection)
    default: false

  knk.admin.towns:
    description: Access to /knk towns
    default: false

  knk.admin.town:
    description: Access to /knk town
    default: false

  knk.admin.districts:
    description: Access to /knk districts
    default: false

  knk.admin.district:
    description: Access to /knk district
    default: false

  knk.admin.locations:
    description: Access to /knk locations
    default: false

  knk.admin.location:
    description: Access to /knk location
    default: false

  knk.admin.enchantments:
    description: Access to /knk enchantments
    default: false

  knk.admin.itemblueprints:
    description: Access to /knk itemblueprints
    default: false

  knk.admin.menu:
    description: Access to /knk menu (InventoryMenu dev harness)
    default: false

  knk.admin.streets:
    description: Access to /knk streets
    default: false

  knk.admin.street:
    description: Access to /knk street
    default: false

  knk.admin.user.manage:
    description: >-
      Open the in-game Player manager (InventoryMenu users.manager, content port CP8) and see its
      hub tile. Every edit inside it is still gated by its own knk.admin.user.<property> node.
    default: false

  knk.admin.user.manage.all:
    description: >-
      Owner override (menu follow-up 2026-09-26): the Player manager lists every player, online and
      offline (searchable), including yourself, and user edits - menu and /knk user - skip the
      rank check (RankHierarchy). The per-property knk.admin.user.<property> nodes still apply.
    default: op

  knk.admin.user.mode:
    description: >-
      Switch another player's staff mode from the in-game Player manager (content port CP8).
      Only to a mode the target holds the node for; owner mode is only set by its holder.
    default: false

  knk.admin.user.salary:
    description: Pay out another player's outstanding salary from the in-game Player manager (content port CP8).
    default: false

  knk.admin.user.info:
    description: View a player's coins/gems/XP/title via /knk user <player> info
    default: false

  knk.admin.user.coins:
    description: Adjust a player's coin balance via /knk user <player> coins set|add|remove
    default: false

  knk.admin.user.gems:
    description: Adjust a player's gem balance via /knk user <player> gems set|add|remove
    default: false

  knk.admin.user.xp:
    description: >-
      Adjust a player's XP (and, indirectly, title) via /knk user <player> xp set|add|remove and the
      Player manager. Raising XP can pay title bonuses in coins and gems, so it also needs
      knk.admin.user.coins and knk.admin.user.gems; lowering it needs only this node.
    default: false

  knk.admin.user.group:
    description: >-
      Add/remove a player's PermissionGroup membership via /knk user <player> group add|remove
      <groupName> [duration]. Requires the actor's highest group weight to exceed the target's
      (RankHierarchy) - cannot act on an equal-or-higher-ranked player.
    default: false

  knk.admin.user.perm:
    description: >-
      Grant/revoke a permission node directly on a player via /knk user <player> perm
      grant|revoke <node> [duration] - e.g. granting knk.mode.staff. Hierarchy-checked, same as
      knk.admin.user.group.
    default: false

  knk.admin.tp:
    description: >-
      Teleport to an online player via /knk tp <player> [-s] (alias of /tp <player>, which also
      accepts this node next to knk.teleport.staff). Hierarchy-checked (RankHierarchy).
    default: false

  knk.admin.user.history:
    description: >-
      View a player's coin, gem and XP ledger history via /knk user <player> history
      [coins|gems|xp] [page] (currency ledger, KNG-23). Read-only, so no rank check. Checked
      through KnkPermissible (in-house grants incl. knk.* / knk.admin.*; ops pass).
    default: op

  # Currency ledger staff nodes (docs/specs/currency-payments/DESIGN.md §3.8, Phase 4). The same
  # strings are checked by knk-web-api for the web app's economy pages; in-game they are checked
  # through KnkPermissible inside /knk currency and the Player manager (in-house grants incl.
  # wildcards such as knk.* / knk.admin.*; ops pass). default: op mirrors that for Bukkit.
  knk.admin.currency:
    description: Umbrella for every knk.admin.currency.* node below.
    default: op
    children:
      knk.admin.currency.history: true
      knk.admin.currency.reverse: true
      knk.admin.currency.lock: true
      knk.admin.currency.policy: true
      knk.admin.currency.alerts: true
      knk.admin.currency.unlimited: true

  knk.admin.currency.history:
    description: >-
      Read any player's ledger history with /knk currency history <player> (each line shows its
      transaction id for reversal); on the web, the balance event log and profile balance history.
    default: op

  knk.admin.currency.reverse:
    description: >-
      Reverse a ledger transaction with /knk currency reverse <txId> [--partial] <reason> (reason
      of at least 10 characters). Never takes a balance below zero; --partial reverses what is left.
    default: op

  knk.admin.currency.lock:
    description: Lock or unlock a player's payments with /knk currency lock <player> <reason> / unlock <player>.
    default: op

  knk.admin.currency.policy:
    description: Edit the coin/gem policy (transfer limits, gem switch, fee, staff grant cap) in the web app.
    default: op

  knk.admin.currency.alerts:
    description: >-
      Currency anomaly alerts (Phase 5): /knk currency alerts [all] [page] and alerts ack <id>, and
      an in-game notice when the API raises a new alert (funnel, velocity, large staff grant,
      reconciliation mismatch...). On the web, the alerts page and the reconciliation run.
    default: op

  knk.admin.currency.unlimited:
    description: >-
      Exempt from the per-staff daily grant cap (CurrencyPolicy.AdminDailyGrantCapPerActor) on
      coin/gem/XP adjustments. Checked by the API against the acting staff member.
    default: false

  knk.tasks:
    description: Access to /knk tasks, /knk task-claim, /knk task-status (world task management)
    default: op

  knk.mode.owner:
    description: >-
      Owner-mode status (docs/specs/user-features/DESIGN.md §6.1), replacing the dead legacy
      k&k.join.owner/k&k.owner/k&k.* checks. Resolved through the new REST-backed permission
      model via KnkPermissible, not through Bukkit's own permission tree - this plugin.yml
      declaration is for documentation/consistency only and isn't what KnkPermissible actually
      checks. It does still bypass via KnkPermissible's own op check: a Minecraft-op'd player
      short-circuits to allowed on every node, same as Bukkit's own default for an undeclared
      permission. A non-op needs a real PermissionGrant or group membership (authoring UI is
      docs/specs/user-features/IMPLEMENTATION_PLAN.md §6.2, a later phase) - until one exists,
      this node resolves undeclared and fails closed for that player. Gates /ownermode; holders
      (like knk.mode.staff holders) can also see players vanished in owner/staff mode.
    default: op

  knk.mode.staff:
    description: >-
      Staff-mode status (docs/specs/user-features/DESIGN.md §6.1), replacing v1's k&k.staff. Gates
      /staffmode, and holders can see players vanished in owner/staff mode. Resolved through the
      new REST-backed permission model via KnkPermissible, not through Bukkit's own permission
      tree - this plugin.yml declaration is for documentation/consistency only and isn't what
      KnkPermissible actually checks. It does still bypass via KnkPermissible's own op check: a
      Minecraft-op'd player short-circuits to allowed on every node, same as Bukkit's own default
      for an undeclared permission. A non-op needs a real PermissionGrant or group membership
      (authoring UI is docs/specs/user-features/IMPLEMENTATION_PLAN.md §6.2, a later phase) -
      until one exists, this node resolves undeclared and fails closed for that player.
    default: op

  knk.kit.list:
    description: >-
      List available kits via /kit list (docs/specs/kits/DESIGN.md §4.3). Resolved through the
      new REST-backed permission model via KnkPermissible, not through Bukkit's own permission
      tree - this plugin.yml declaration is for documentation/consistency only and isn't what
      KnkPermissible actually checks. A Minecraft-op'd player short-circuits to allowed on every
      node via KnkPermissible's own op check; a non-op needs a real PermissionGrant or group
      membership, until which this node resolves undeclared and fails closed.
    default: op

  knk.kit.get:
    description: >-
      Self-claim a kit via /kit get <name> (docs/specs/kits/DESIGN.md §4.3). Same
      KnkPermissible/op-bypass caveat as knk.kit.list.
    default: op

  knk.kit.give:
    description: >-
      Staff-give a kit to another player via /kit give <player> <name>, bypassing the
      recipient's own gating/cooldown/cost (docs/specs/kits/DESIGN.md §0b/§4.1/§4.3). Same
      KnkPermissible/op-bypass caveat as knk.kit.list.
    default: op

  knk.kit.purchase:
    description: >-
      Purchase a single-purchase-premium kit via /kit purchase <name> (docs/specs/kits/
      DESIGN.md §4.3/§5.2). Same KnkPermissible/op-bypass caveat as knk.kit.list.
    default: op

  knk.kit.manage:
    description: >-
      Gates /kit manage's FormWizard-pointer subcommands (docs/specs/kits/DESIGN.md §0c/§4.5) -
      no in-game Kit CRUD exists, this only guards advertising the FormWizard route to players
      with no reason to see it. Same KnkPermissible/op-bypass caveat as knk.kit.list.
    default: op

  # Lootboxes (docs/specs/lootboxes/DESIGN.md §3.4). Resolved through KnkPermissible, like knk.kit.*; the two player
  # nodes are granted to the Default permission group by knk-web-api's LootboxSeed, the admin nodes never are.
  knk.lootbox.open:
    description: Open (claim) a lootbox in the world by clicking it, or a lootbox token item by right-clicking it.
    default: true
  knk.lootbox.odds:
    description: See what a lootbox can give via /lootbox odds <category> [stars].
    default: true
  knk.lootbox.admin.*:
    description: Every /knk lootbox admin action.
    default: op
    children:
      knk.lootbox.admin.spawn: true
      knk.lootbox.admin.despawn: true
      knk.lootbox.admin.list: true
      knk.lootbox.admin.tp: true
      knk.lootbox.admin.give: true
      knk.lootbox.admin.token: true
      knk.lootbox.admin.reload: true
      knk.lootbox.admin.area: true
  knk.lootbox.admin.spawn:
    description: /knk lootbox spawn <category> [stars] - a box where you stand, ignoring caps (audited).
    default: op
  knk.lootbox.admin.despawn:
    description: /knk lootbox despawn [id|nearest] - remove an active box.
    default: op
  knk.lootbox.admin.list:
    description: /knk lootbox list [area] - the active boxes.
    default: op
  knk.lootbox.admin.tp:
    description: /knk lootbox tp <id> - teleport to an active box.
    default: op
  knk.lootbox.admin.give:
    description: /knk lootbox give <player> <category> [stars] - roll and deliver without a world box (audited).
    default: op
  knk.lootbox.admin.token:
    description: >-
      /knk lootbox token <player> <category> [stars|any] [amount] - issue lootbox token items (right-click to open;
      identified by their knk_lootbox_token tag only), audited.
    default: op
  knk.lootbox.admin.reload:
    description: /knk lootbox reload - re-read config.yml's lootboxes section and the API's runtime config.
    default: op
  knk.lootbox.admin.area:
    description: >-
      /knk lootbox area create|list|info|delete - spawn areas from a WorldEdit selection (region lootbox_<name>,
      full height); delete only removes lootbox_ regions.
    default: op

  # KNG-9 player commands. Resolved through KnkPermissible (the REST-backed permission model), not
  # Bukkit's permission tree - these declarations document the nodes; the same caveat as knk.kit.list
  # applies (ops pass via KnkPermissible's op bypass, non-ops need a real grant or group membership).
  # Wildcards work in grants, e.g. knk.heal.* covers knk.heal, knk.heal.others and knk.heal.all.
  knk.fly:
    description: Toggle your own flight with /fly (KNG-9).
    default: op

  knk.fly.others:
    description: Toggle or set an online player's flight with /fly [on|off] <player> (KNG-9).
    default: op

  knk.heal:
    description: Heal yourself with /heal (KNG-9).
    default: op

  knk.heal.others:
    description: Heal an online player with /heal <player> (KNG-9).
    default: op

  knk.heal.all:
    description: Heal every online player with /heal all (KNG-9).
    default: op

  knk.feed:
    description: Feed yourself with /feed (KNG-9). Its own node - v2's /feed wrongly checked the /heal nodes.
    default: op

  knk.feed.others:
    description: Feed an online player with /feed <player> (KNG-9).
    default: op

  knk.feed.all:
    description: Feed every online player with /feed all (KNG-9).
    default: op

  knk.enderchest:
    description: Open your own ender chest with /enderchest (/ec) (KNG-9).
    default: op

  knk.enderchest.open:
    description: Open an online player's ender chest with /enderchest <player> (KNG-9). Rank-checked (RankHierarchy).
    default: op

  knk.inventory.open:
    description: Open (and edit) an online player's inventory with /inventory open <player> (KNG-9). Rank-checked (RankHierarchy).
    default: op

  knk.inventory.clear:
    description: Clear an online player's inventory with /inventory clear <player> confirm (KNG-9). Rank-checked (RankHierarchy) unless it's your own.
    default: op

  # Currency ledger Phase 3 (docs/specs/currency-payments/DESIGN.md §3.8). Resolved through
  # KnkPermissible, same caveat as knk.kit.list. The player nodes are granted to the Default group
  # by knk-web-api migration SeedCurrencyPlayerNodes, so every account has them.
  knk.pay:
    description: Pay coins to another player with /pay <player> <amount> (confirm/cancel large payments).
    default: op

  knk.pay.gems:
    description: >-
      Also pay gems with /pay <player> <amount> gems. Gems are premium and not transferable by the
      API's policy (DESIGN.md §5 Q2) - this node alone doesn't make them transferable.
    default: false

  knk.pay.bypass:
    description: >-
      Staff paying out events: skip the per-payment maximum, daily caps, cooldown and the
      account-age/title rule for sending (never the balance, the recipient's cap or locks).
    default: false

  knk.balance:
    description: See your own coins and gems with /balance.
    default: op

  knk.balance.others:
    description: See another player's coins and gems with /balance <player>.
    default: op

  knk.baltop:
    description: See the richest players with /baltop.
    default: op

  knk.baltop.exempt:
    description: >-
      Staff: left off /baltop (checked by the API from an exact grant of this node, directly or
      through a group - a wildcard grant doesn't count).
    default: false

  knk.transactions:
    description: See your own coin, gem and XP history with /transactions.
    default: op

  knk.transactions.others:
    description: See another player's history with /transactions <player>.
    default: false

  knk.freeze:
    description: >-
      Freeze a player via /freeze <player> <reason> - locks their movement, chat, commands, and
      damage until unfrozen. Persisted server-side so it applies even to an offline target and
      takes effect on their next join. Hierarchy-checked (RankHierarchy) - cannot freeze an
      equal-or-higher-ranked player.
    default: false

  knk.unfreeze:
    description: Unfreeze a player via /unfreeze <player>. Hierarchy-checked, same as knk.freeze.
    default: false

  knk.staffchat:
    description: >-
      Send and receive /staffchat (/sc) broadcasts. (No longer drives the /msg social spy - see
      knk.socialspy.)
    default: op

  knk.socialspy:
    description: >-
      Receive the social spy feed (every private message between two other players) and use
      /socialspy to turn it on or off. Checked through the in-house permission model.
    default: op

  knk.socialspy.exempt:
    description: >-
      Your private messages (sent or received) are hidden from spies who don't hold this node
      themselves; you do see such messages. Meant for the owner group.
    default: op

  knk.msg.bypass.ratelimit:
    description: No private message rate limit (private-messages.rate-limit in config.yml).
    default: op

  knk.pmlog.read:
    description: >-
      Read players' private messages in knk-web-api's PM log (web app, owner group). Checked by the
      API; every read is written to the audit log. Listed here for documentation.
    default: op

  knk.msg.bypass.ignore:
    description: >-
      Your private messages reach players who /ignore you (meant for staff). Checked through the
      in-house permission model.
    default: op

  knk.msg.unignorable:
    description: >-
      Players can't /ignore you (meant for staff, so moderation contact stays possible). Checked by
      knk-web-api through the in-house permission model.
    default: op

  knk.gate.open.*:
    description: Permission to open any gate
    default: false
    
  knk.gate.close.*:
    description: Permission to close any gate
    default: false

  knk.gate.passthrough.use:
    description: Base permission to trigger any gate pass-through mode by right-clicking a closed, pass-through-enabled gate
    default: false

  knk.gate.passthrough.instant:
    description: Extra permission required to use the InstantOpen gate pass-through mode
    default: false

  knk.gate.admin:
    description: Permission to use admin gate commands. Also grants full, unconditional gate pass-through access (bypasses AllowPassThrough and mode permissions).
    default: op
    children:
      knk.gate.open.*: true
      knk.gate.close.*: true
      knk.gate.passthrough.use: true
      knk.gate.passthrough.instant: true

  # Account management permissions (Phase 4+)
  knk.account.use:
    description: Ability to use /account command (view status)
    default: true

  knk.account.create:
    description: Create account with email/password via /account create
    default: true
    
  knk.account.link:
    description: Generate or consume link codes via /account link
    default: true

  knk.account.admin:
    description: Admin account management (future view/modify other players' accounts)
    default: op

  customenchantments.command.use:
    description: Allows use of /ce root command
    default: true

  customenchantments.command.add:
    description: Allows adding custom enchantments with /ce add
    default: op

  customenchantments.command.remove:
    description: Allows removing custom enchantments with /ce remove
    default: op

  customenchantments.command.info:
    description: Allows viewing custom enchantments with /ce info
    default: true

  customenchantments.command.info.others:
    description: Allows viewing other players' item enchantments with /ce info <player>
    default: op

  customenchantments.command.cooldown.clear:
    description: Allows clearing your own enchantment cooldowns
    default: op

  customenchantments.command.cooldown.clear.others:
    description: Allows clearing other players' enchantment cooldowns
    default: op

  customenchantments.command.reload:
    description: Allows reloading custom enchantment config with /ce reload
    default: op

  # Teleports (docs/specs/teleport/DESIGN.md §3.3, KNG-17). Resolved through KnkPermissible, same
  # caveat as knk.kit.list (ops pass via the op bypass; non-ops need a real grant or group membership).
  knk.teleport.staff:
    description: >-
      /tp <player> and /tp <x> <y> <z> - instant, rank-checked staff teleports (no warmup, cost,
      cooldown or safe-spot check; freeze/region/siege guards still apply). knk.admin.tp is still
      accepted for /tp <player> and /knk tp.
    default: op

  knk.teleport.staff.others:
    description: Move other players - /tp <player> <target>, /tphere <player>, /spawn <player> and /warp <destination> <player>. You must outrank everyone involved.
    default: op

  knk.teleport.staff.silent:
    description: The -s flag on staff teleports - no message to the moved or visited player. Vanished staff are always silent.
    default: op

  knk.teleport.request:
    description: >-
      /tpa <player> - ask to teleport to a player; they accept or deny, then you warm up and go.
      Meant for the Default group. Answering (/tpaccept, /tpdeny) needs no node.
    default: op

  knk.teleport.request.here:
    description: /tpahere <player> - ask a player to teleport to you. Meant for the Dragon Blood premium tier.
    default: op

  knk.teleport.spawn:
    description: >-
      /spawn - teleport to the server spawn (set on the web-app Game Settings page, else the main
      world's spawn). Free; warmup, cooldown and combat tag apply. Meant for the Default group.
    default: op

  knk.teleport.warp:
    description: >-
      /warp <destination> (/point) and /warps - teleport to a Town, District or Structure enabled as a
      destination. Warmup, cooldown and combat tag apply; the web API checks the destination's title,
      premium tier and discovery requirements and takes its gem price after the warmup. Meant for the
      Default group.
    default: op

  knk.teleport.back:
    description: >-
      /back - return to where you last died, within teleport.back.expire-seconds (5 min) of the death,
      once per death. Warmup, cooldown, combat tag and the safe-spot check apply; a siege death gives no
      /back. Meant for the Dragon Blood premium tier. With several knk.teleport.back.* kinds, /back goes
      to the latest place among them.
    default: op

  knk.teleport.back.warps:
    description: /back - return to where you were before your last /warp or menu warp (KNG-42).
    default: op

  knk.teleport.back.teleport:
    description: >-
      /back - return to where you were before your last /tpa or /tpahere (whoever moved) or your own
      staff /tp (KNG-42). Being moved by staff isn't recorded.
    default: op

  knk.teleport.back.spawn:
    description: /back - return to where you were before your last /spawn (KNG-42).
    default: op

  knk.teleport.back.all:
    description: /back to every kind of place (death, warps, teleport, spawn). knk.teleport.back.* works too.
    default: op

  knk.teleport.staff.back.others:
    description: >-
      /back <player> [-s] - send a player you outrank back to their latest /back place of any kind.
      Instant and audited; uses their entry up.
    default: op

  knk.teleport.bypass.requirements:
    description: /warp ignores destinations' title, premium tier and discovery requirements.
    default: op

  knk.teleport.bypass.cost:
    description: /warp is free (no gem price), and so is /back when teleport.back.price-coins is set.
    default: op

  knk.teleport.warmup.short:
    description: Player teleports wait teleport.warmup-short-seconds (3 s) instead of warmup-seconds (5 s). Meant for the Noble premium tier and up.
    default: op

  knk.teleport.bypass.warmup:
    description: Player teleports happen without a warmup.
    default: op

  knk.teleport.bypass.cooldown:
    description: No cooldown after player teleports, and none between teleport requests.
    default: op

  knk.teleport.bypass.combat:
    description: Player teleports are allowed while combat-tagged.
    default: op

  knk.region.bypass:
    description: >-
      Walk and teleport into domains with AllowEntry off and out of domains with AllowExit off. A
      staff teleport of another player carries the staff member's bypass (e.g. putting someone in a jail).
    default: op

  # Siege minigame (docs/specs/siege-minigame/DESIGN.md §11.1). Checked through KnkPermissible, like
  # the kit nodes: these declarations are documentation, an op short-circuits to allowed, and a
  # non-op needs a PermissionGrant/group membership. DESIGN §11.1: no Bukkit default beyond
  # knk.siege.play.
  knk.siege.play:
    description: Play sieges - /siege, join, leave, info, vote, spawn
    default: true

  knk.siege.skip:
    description: Skip a lobby's cooldown with /siege skip (v1 donator perk; grant to a premium group)
    default: false

  knk.siege.admin.list:
    description: /siege admin list - every lobby with phase, lock and members
    default: false

  knk.siege.admin.control:
    description: /siege admin start|stop|skip|kick - start matchmaking, abort (restore, no rewards), skip, remove a member
    default: false

  knk.siege.admin.reload:
    description: /siege admin reload - refresh the runtime config for lobbies not in a match
    default: false

  knk.siege.admin.manage:
    description: /siege admin manage - pointer to the web-app forms (no in-game editing)
    default: false

  knk.siege.bypass.commands:
    description: Run any command while in a siege match (bypasses SiegeConfiguration.AllowedCommands, DESIGN §6.9), and teleport yourself out of it (/tp, /spawn, /warp, /tpa, /back). Staff still can't move another member - /siege admin kick first.
    default: false

  knk.menu:
    description: Open the InventoryMenu hub with /menu (content port CP1).
    default: true

  knk.discoveries:
    description: Open your discoveries menu with /discoveries (domain discovery, KNG-20).
    default: true

  knk.admin.discovery:
    description: >-
      /knk discovery list|reset|status - list a player's discoveries, reset one so it can be
      discovered and rewarded again (no claw-back), and see the tracker/spool. The same node gates
      the web app's discovery admin page. Also granted through the in-house permission system.
    default: false
